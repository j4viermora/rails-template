default: &default
  adapter: postgresql
  encoding: unicode
  host: localhost
  port: 5432
  username: asisto
  password: password
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: asito_development

test:
  <<: *default
  database: asisto_test

production:
  <<: *default
  database: asisto_production
  username: <%= ENV["DATABASE_USERNAME"] %>
  password: <%= ENV["DATABASE_PASSWORD"] %>
  host: <%= ENV["DATABASE_HOST"] %>
